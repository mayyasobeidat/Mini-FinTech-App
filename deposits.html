<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سجل الإيداعات - بيت العيلة</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <style>
    body { background-color: #f8f9fa; padding: 15px; font-family: 'Segoe UI', sans-serif; }
    .card { border-radius: 18px; border-top: 5px solid #16a34a; }
    .badge-deposit { background-color: #dcfce7; color: #15803d; font-weight: bold; font-size: 0.95rem; }
  </style>
</head>
<body>

<div class="container card shadow-sm p-3 p-md-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0 text-success fw-bold"><i class="bi bi-wallet2 me-2"></i>سجل إيداعات العائلة</h5>
   <!-- زر الرجوع المعدل -->
<a href="index.html" class="btn btn-sm btn-outline-secondary">
  <i class="bi bi-arrow-left me-1"></i>رجوع للأرصدة
</a>
  </div>

  <!-- فلتر الأشخاص -->
  <div class="row g-2 mb-3">
    <div class="col-md-4">
      <select id="nameFilter" class="form-select form-select-sm" onchange="filterDeposits()">
        <option value="ALL">عرض إيداعات الجميع</option>
        <option value="محمد">محمد</option>
        <option value="سماح">سماح</option>
        <option value="نصر">نصر</option>
        <option value="عبدالله">عبدالله</option>
        <option value="محمود">محمود</option>
        <option value="عبود">عبود</option>
        <option value="مياس">مياس</option>
      </select>
    </div>
  </div>

  <div id="loader" class="text-center my-4">
    <div class="spinner-border text-success"></div>
  </div>

  <div id="table-container" class="table-responsive" style="display:none;">
    <table class="table table-hover align-middle text-center border">
      <thead class="table-light">
        <tr>
          <th>التاريخ</th>
          <th>الاسم</th>
          <th>المبلغ المودع</th>
          <th>ملاحظات</th>
        </tr>
      </thead>
      <tbody id="deposits-body"></tbody>
    </table>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbzlR2y6nbCtt6CeUXaOqU_cCYUVZO4Jh-hcyizAhTQlENGqddd38hv2dYwnNJynIBGksA/exec';
  let allDeposits = [];

  window.onload = async function() {
    try {
      // إضافة redirect: 'follow' للتعامل مع توجيهات Google Apps Script
      const res = await fetch(`${API_URL}?action=getDeposits`, { redirect: 'follow' });
      allDeposits = await res.json();
      
      document.getElementById('loader').style.display = 'none';
      document.getElementById('table-container').style.display = 'block';
      renderTable(allDeposits);
    } catch(e) {
      document.getElementById('loader').innerHTML = '<span class="text-danger">❌ فشل تحميل البيانات</span>';
    }
  };

  function renderTable(data) {
    const tbody = document.getElementById('deposits-body');
    tbody.innerHTML = '';
    
    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-muted">لا يوجد إيداعات مسجلة.</td></tr>';
      return;
    }

    data.slice().reverse().forEach(row => {
      // تنظيف المبلغ من الفواصل والرموز لضمان التحويل الرقمي الصحيح
      const cleanAmount = String(row[2] || '0').replace(/,/g, '').trim();
      const amountVal = parseFloat(cleanAmount) || 0;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><small class="text-muted">${formatDate(row[0])}</small></td>
        <td class="fw-bold">${row[1] || '-'}</td>
        <td><span class="badge badge-deposit p-2">${amountVal.toFixed(2)} د.أ</span></td>
        <td class="text-muted small">${row[3] || '-'}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function filterDeposits() {
    const selected = document.getElementById('nameFilter').value;
    if (selected === 'ALL') {
      renderTable(allDeposits);
    } else {
      const filtered = allDeposits.filter(row => row[1] && String(row[1]).trim() === selected);
      renderTable(filtered);
    }
  }

  function formatDate(dateStr) {
    if (!dateStr || dateStr === '-') return '-';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr; // إرجاع النص الأصلي كما هو إذا تعذر تحويله لتاريخ
    return d.toLocaleString('en-GB', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:true }).toUpperCase();
  }
</script>
</body>
</html>
